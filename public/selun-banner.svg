<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bannerBg" x1="160" y1="40" x2="1410" y2="880" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DDF0FF" />
      <stop offset="0.5" stop-color="#EFF6FF" />
      <stop offset="1" stop-color="#DEE9FF" />
    </linearGradient>
    <radialGradient id="bannerGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(800 404) rotate(90) scale(264 332)">
      <stop stop-color="#FFFFFF" stop-opacity="0.96" />
      <stop offset="0.45" stop-color="#E8F8FF" stop-opacity="0.8" />
      <stop offset="1" stop-color="#E8F8FF" stop-opacity="0" />
    </radialGradient>
    <pattern id="bannerGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#1F4C7B" stroke-opacity="0.08" />
    </pattern>
    <linearGradient id="bannerOrbitA" x1="-164" y1="-146" x2="186" y2="198" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8CE6FF" />
      <stop offset="1" stop-color="#267AD9" />
    </linearGradient>
    <linearGradient id="bannerOrbitB" x1="182" y1="-114" x2="-138" y2="204" gradientUnits="userSpaceOnUse">
      <stop stop-color="#95E8FF" />
      <stop offset="1" stop-color="#2C89E5" />
    </linearGradient>
    <radialGradient id="bannerCore" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 -8) rotate(90) scale(126)">
      <stop offset="0" stop-color="#E9FBFF" />
      <stop offset="0.42" stop-color="#90E1FF" />
      <stop offset="0.82" stop-color="#49ADEE" />
      <stop offset="1" stop-color="#247DD7" />
    </radialGradient>
    <radialGradient id="bannerNode" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) rotate(90) scale(10)">
      <stop stop-color="#E8FBFF" />
      <stop offset="1" stop-color="#49B8EC" />
    </radialGradient>
    <filter id="bannerBlur" x="350" y="74" width="900" height="616" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix" />
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape" />
      <feGaussianBlur stdDeviation="42" result="effect1_foregroundBlur" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bannerBg)" />
  <rect width="1600" height="900" fill="url(#bannerGrid)" />
  <rect width="1600" height="900" fill="url(#bannerGlow)" />

  <g filter="url(#bannerBlur)" opacity="0.42">
    <circle cx="782" cy="360" r="170" fill="#F6FCFF" />
  </g>

  <g transform="translate(800 330)">
    <g fill="none" stroke-linecap="round">
      <ellipse cx="0" cy="0" rx="208" ry="108" transform="rotate(-27 0 0)" stroke="url(#bannerOrbitA)" stroke-width="16" />
      <ellipse cx="0" cy="0" rx="208" ry="108" transform="rotate(27 0 0)" stroke="url(#bannerOrbitB)" stroke-width="16" />
    </g>

    <circle cx="0" cy="-8" r="120" fill="url(#bannerCore)" />
    <circle cx="112" cy="-126" r="11" fill="url(#bannerNode)" />
    <circle cx="170" cy="-74" r="10" fill="url(#bannerNode)" />
    <circle cx="-154" cy="-88" r="10" fill="url(#bannerNode)" />
    <circle cx="-146" cy="6" r="10" fill="url(#bannerNode)" />
  </g>

  <text x="800" y="688" text-anchor="middle" fill="#2C4F83" font-family="'Space Grotesk', 'Manrope', sans-serif" font-size="146" letter-spacing="0.34em">
    SELUN
  </text>
</svg>
